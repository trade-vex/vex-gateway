# Kafka Connect worker of the read model, the same in every environment. The environment supplies
# KAFKA_BOOTSTRAP_SERVERS and SCHEMA_REGISTRY_URL; the worker fails at startup without them.
bootstrap.servers=${env:KAFKA_BOOTSTRAP_SERVERS}
group.id=vex-readmodel-connect
listeners=http://0.0.0.0:8083
plugin.path=/opt/vex-connect/plugins
# Confluent's plugins have no ServiceLoader manifests, so they are found by scanning.
plugin.discovery=only_scan

# Connect creates its internal topics itself (broker auto-creation is off), replicated like the
# event topics.
config.storage.topic=vex-readmodel-connect-configs
offset.storage.topic=vex-readmodel-connect-offsets
status.storage.topic=vex-readmodel-connect-status
config.storage.replication.factor=3
offset.storage.replication.factor=3
status.storage.replication.factor=3
offset.flush.interval.ms=10000

# A sink task that cannot reach Postgres retries inside one put(), as its connector says: it
# tries to connect 7 times, 30 s apart (connection.attempts, connection.backoff.ms), which rides
# out an outage of up to 3 minutes; the URL cuts each login off after loginTimeout=10 (s) and
# each wait for an answer after socketTimeout=15 (s). A wait that gets no answer then closes the
# connection, and closing a TLS 1.3 connection waits up to that timeout again, so it lasts twice
# its timeout. One put() blocks for at most 2 x 5 s (the check of its cached connection)
# + 7 x 10 s + 6 x 30 s + 2 x 2 x 15 s (the JDBC dialect's query on a new writer's first
# connection, and one statement) = 320 s; only a write to a server that drops packets silently
# can block longer, until TCP gives up (RUNBOOK.md "Connector Failures"). Its consumer does not
# poll meanwhile, so the poll interval is set here, to 10 min: the Kafka consumer's default of
# 5 min is less than that sum. run.py checks that it exceeds the sum.
consumer.max.poll.interval.ms=600000

# vex-core's keys are UTF-8 strings; its values are Schema Registry framed trading.proto messages.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.protobuf.ProtobufConverter
value.converter.schema.registry.url=${env:SCHEMA_REGISTRY_URL}

# Connector secrets come from files mounted into the worker, never from the connector configs.
# The REST API has no authentication, so the providers reach only the worker's two variables and
# /etc/vex-connect: a connector config cannot read the worker's other variables or files.
config.providers=file,env
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
config.providers.file.param.allowed.paths=/etc/vex-connect
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider
config.providers.env.param.allowlist.pattern=^(KAFKA_BOOTSTRAP_SERVERS|SCHEMA_REGISTRY_URL)$
