# The read model's test stack: a three-broker Redpanda (Kafka and Schema Registry), Postgres,
# ClickHouse, the Kafka Connect worker of readmodel/connect and the real vex-core at the rev
# Cargo.lock pins, with the Aeron Archive that journals its commands, both built from vex-core's
# own Dockerfiles. run.py drives it; nothing publishes a fixed host port, and every Aeron directory
# is inside a container.
#
# CORE_DIR is a checkout of trade-vex/vex-core at CORE_REV; TLS_DIR holds the throwaway CA and
# server certificates run.py generates.

x-redpanda: &redpanda
  image: redpandadata/redpanda:v25.3.1@sha256:5e6ef104f48f430c25b5ddf1e1bef83394086d51ad6e752b78d10a018f74833d
  # Each broker advertises its own service name, which is also its hostname. A tenth of Seastar's
  # default networking I/O control blocks keeps each broker's share of the host's Linux AIO limit
  # (fs.aio-max-nr) small enough for three to start next to other Seastar processes.
  entrypoint:
    - bash
    - -c
    - >-
      exec rpk redpanda start --smp=1 --memory=1G --reserve-memory=0M --overprovisioned
      --max-networking-io-control-blocks=1000
      --default-log-level=warn --seeds=redpanda-0:33145,redpanda-1:33145,redpanda-2:33145
      --kafka-addr=internal://0.0.0.0:9092 --advertise-kafka-addr=internal://$$HOSTNAME:9092
      --rpc-addr=0.0.0.0:33145 --advertise-rpc-addr=$$HOSTNAME:33145
      --set redpanda.auto_create_topics_enabled=false
  # Healthy: the cluster is, and this broker's Schema Registry answers. docker pause marks a broker
  # unhealthy until this passes again (run.py wait_for_kafka).
  healthcheck:
    test:
      - CMD-SHELL
      - rpk cluster health | grep -Eq 'Healthy:.+true' && rpk registry subject list > /dev/null
    interval: 2s
    timeout: 5s
    retries: 60

services:
  redpanda-0:
    <<: *redpanda
    hostname: redpanda-0
  redpanda-1:
    <<: *redpanda
    hostname: redpanda-1
  redpanda-2:
    <<: *redpanda
    hostname: redpanda-2

  postgres:
    image: postgres:15.15@sha256:98fe06b500b5eb29e45bf8c073eb0ca399790ce17b1d586448edc4203627d342
    # TLS with the certificate the CA in TLS_DIR signed for this host name, and pg_hba.conf, which
    # refuses Connect's role any connection without it. Postgres reads only a key its own user
    # owns, so the certificate and key are copied in first; run.py swaps them the same way.
    entrypoint:
      - bash
      - -c
      - >-
        install -D -o postgres -g postgres -m 600 -t /var/lib/postgresql/tls
        /tls/postgres.crt /tls/postgres.key
        && exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/tls/postgres.crt
        -c ssl_key_file=/var/lib/postgresql/tls/postgres.key
        -c hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: readmodel
      POSTGRES_PASSWORD: postgres
    volumes:
      - ${TLS_DIR:?}:/tls:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "readmodel"]
      interval: 2s
      timeout: 5s
      retries: 30

  clickhouse:
    # The 26.8 LTS. The read model needs 26.3 or later (RUNBOOK.md "Read Model").
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    # HTTPS only, with the certificate the CA in TLS_DIR signed for this host name
    # (clickhouse.xml), so Connect reaches it over TLS or not at all; run.py uses the native
    # protocol inside the container. The certificate and key are copied in for the server's user
    # when the container is created; run.py swaps them the same way and restarts the container.
    entrypoint:
      - bash
      - -c
      - >-
        { test -f /etc/clickhouse-server/tls/clickhouse.crt
        || install -D -o clickhouse -g clickhouse -m 600 -t /etc/clickhouse-server/tls
        /tls/clickhouse.crt /tls/clickhouse.key; }
        && exec /entrypoint.sh
    environment:
      CLICKHOUSE_DB: readmodel
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ${TLS_DIR:?}:/tls:ro
      - ./clickhouse.xml:/etc/clickhouse-server/config.d/readmodel.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user=admin", "--password=admin", "--query=SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  connect:
    build: ../connect
    image: vex-readmodel-connect:test
    depends_on:
      redpanda-0: {condition: service_healthy}
      redpanda-1: {condition: service_healthy}
      redpanda-2: {condition: service_healthy}
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda-0:9092,redpanda-1:9092,redpanda-2:9092
      SCHEMA_REGISTRY_URL: http://redpanda-0:8081,http://redpanda-1:8081,http://redpanda-2:8081
    volumes:
      - ./postgres.properties:/etc/vex-connect/postgres.properties:ro
      - ${TLS_DIR:?}/ca.crt:/etc/vex-connect/postgres-ca.pem:ro
      - ./clickhouse.properties:/etc/vex-connect/clickhouse.properties:ro
      - ${TLS_DIR:?}/ca.crt:/etc/vex-connect/clickhouse-ca.pem:ro
    ports:
      - 127.0.0.1::8083
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/connectors"]
      interval: 2s
      timeout: 5s
      retries: 90

  # The media driver the core uses, with the Aeron Archive that journals its commands, as the
  # pinned vex-core's own test stack runs it (xtask/tests/archive.Dockerfile). The core shares its
  # network and IPC namespaces, so the journal outlives a core that is stopped or killed, and the
  # core replays it at every start.
  aeron-archive:
    build:
      context: ${CORE_DIR:?}/xtask/tests
      dockerfile: archive.Dockerfile
    image: vex-readmodel-archive:${CORE_REV:?}
    ipc: shareable
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "test -f /dev/shm/aeron-test-server/cnc.dat"]
      interval: 2s
      timeout: 5s
      retries: 30

  core:
    build:
      context: ${CORE_DIR:?}
      dockerfile: xtask/tests/server.Dockerfile
    image: vex-readmodel-core:${CORE_REV:?}
    depends_on:
      redpanda-0: {condition: service_healthy}
      redpanda-1: {condition: service_healthy}
      redpanda-2: {condition: service_healthy}
      aeron-archive: {condition: service_healthy}
    environment:
      VEX_ENV: development
      # Set, it binds the core to every interface; it is reached as aeron-archive.
      VEX_SERVER_HOST: aeron-archive
      VEX_SERVER_PORT: "3521"
      VEX__KAFKA_BROKER: redpanda-0:9092,redpanda-1:9092,redpanda-2:9092
      VEX__SCHEMA_REGISTRY_URL: http://redpanda-0:8081
      LD_LIBRARY_PATH: /usr/local/lib
      RUST_LOG: info
    network_mode: service:aeron-archive
    ipc: service:aeron-archive
    volumes:
      # The configuration readmodel/seeds/development.sql is generated from.
      - ${CORE_DIR:?}/config.dev.yaml:/etc/vex/config.dev.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x test_server && test -f /dev/shm/aeron-test-server/cnc.dat"]
      interval: 2s
      timeout: 5s
      retries: 60

  # One-shot tools, run with `docker compose run`.
  traffic:
    profiles: [tools]
    build:
      context: ../..
      dockerfile: readmodel/tests/traffic/Dockerfile
    image: vex-readmodel-traffic:test
    depends_on:
      core: {condition: service_healthy}
    shm_size: 256m

  migrate:
    profiles: [tools]
    image: migrate/migrate:v4.20.1@sha256:76cc2074cb6642631f34a898ced71e6aeaa6b1a4d78c4daa743275a22e0c5be7
    volumes:
      - ../migrations:/migrations:ro

  buf:
    profiles: [tools]
    image: bufbuild/buf:1.74.0@sha256:621f108266b19236906aa328e64b7c50340738472c5da4d4b25104f01aa8d204
    command: ["build", "-o", "-#format=json"]
    working_dir: /protos
    volumes:
      - ${CORE_DIR:?}/processors/src/protos:/protos:ro
