# Development environment configuration for VEX Gateway Service
# Overrides default.toml with development-specific settings

environment = "development"

[server]
host = "127.0.0.1"
port = 8081
max_connections = 100
connection_timeout = 60
keep_alive_timeout = 120

[logging]
level = "debug"
structured = false
colored = true

[auth]
# JWT Configuration
[auth.jwt]
private_key_path = "crates/libs/lib-auth/src/keys/private_key.pem"
public_key_path = "crates/libs/lib-auth/src/keys/public_key.pem"
access_token_ttl_minutes = 60
refresh_token_ttl_days = 30
issuer = "vex-gateway-dev"
audience = "vex-api-dev"

# Database Configuration (Docker)
[auth.database]
url = "postgresql://postgres:postgres123@localhost:5432/trading_db"
max_connections = 10

# Redis Configuration (Docker)
[auth.redis]
url = "redis://127.0.0.1:6380"
max_connections = 10

# OAuth Configuration
[auth.oauth]
redirect_base = "http://localhost:8081"

[auth.oauth.providers]
# Empty for development - can add providers later if needed

# Email Configuration (for testing, using fake SMTP)
[auth.email]
smtp_host = "localhost"
smtp_port = 1025
smtp_username = "test@example.com"
smtp_password = "password"
from_email = "noreply@vex-gateway.dev"

# Server Configuration
[auth.server]
base_url = "http://localhost:8081"
port = 8081

# OTP Configuration
[auth.otp]
otp_length = 6
email_verification_expiry_minutes = 15