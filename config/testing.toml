# Testing environment configuration for VEX Gateway Service
# Overrides default.toml with testing-specific settings

environment = "testing"

[server]
host = "127.0.0.1"
port = 0  # Use random port for testing
max_connections = 50
connection_timeout = 10
keep_alive_timeout = 30

[logging]
level = "warn"
structured = true
colored = false 