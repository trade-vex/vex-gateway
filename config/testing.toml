# Testing environment configuration for VEX Gateway Service
# Overrides default.toml with testing-specific settings

environment = "testing"

[server]
host = "127.0.0.1"
port = 0  # Use random port for testing
max_connections = 50
connection_timeout = 10
keep_alive_timeout = 30

[logging]
level = "warn"
structured = true
colored = false

[auth]
# JWT Configuration
[auth.jwt]
private_key_path = "crates/libs/lib-auth/src/keys/private_key.pem"
public_key_path = "crates/libs/lib-auth/src/keys/public_key.pem"
access_token_ttl_minutes = 60
refresh_token_ttl_days = 30
issuer = "vex-gateway-test"
audience = "vex-api-test"

# Database Configuration
[auth.database]
url = "postgresql://postgres:postgres123@localhost:5432/trading_db_test"
max_connections = 10

# Redis Configuration
[auth.redis]
url = "redis://127.0.0.1:6380"
max_connections = 10

# OAuth Configuration
[auth.oauth]
redirect_base = "http://localhost:8081"

[auth.oauth.providers]
# Empty for testing

# Email Configuration (Gmail SMTP for testing)
[auth.email]


# Server Configuration
[auth.server]
base_url = "http://localhost:8081"
port = 0

# OTP Configuration
[auth.otp]
otp_length = 6
email_verification_expiry_minutes = 15