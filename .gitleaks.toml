# Issue #47 records the three known private-key blobs below. Each entry MUST be
# deleted once the keys are rotated and the history purged. AND requires both
# an exact introducing commit and an exact target path, so a new key committed
# at either path remains blocking.
[[allowlists]]
description = "Historical certs JWT private-key blob tracked in issue #47"
targetRules = ["private-key"]
condition = "AND"
commits = [
  "4ea6eafd30f559d38c60124a13825ab2098bc231",
]
paths = [
  '''^certs/jwt_private_key\.pem$''',
]

[[allowlists]]
description = "Historical lib-auth original private-key blob tracked in issue #47"
targetRules = ["private-key"]
condition = "AND"
commits = [
  "4ea6eafd30f559d38c60124a13825ab2098bc231",
]
paths = [
  '''^crates/libs/lib-auth/src/keys/private_key\.pem$''',
]

[[allowlists]]
description = "Historical lib-auth replacement private-key blob tracked in issue #47"
targetRules = ["private-key"]
condition = "AND"
commits = [
  "1596b6131fed07530a7613e4180bbf0962584656",
  "893aff4b8c1a6c0d0174c99ac2ab20fc69d52814",
  "eeca3e20ddb350066c92c17b3d4c1d1b09ab7237",
]
paths = [
  '''^crates/libs/lib-auth/src/keys/private_key\.pem$''',
]
