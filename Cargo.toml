[workspace]
resolver = "2"
members = [ "crates/bin" , "crates/tests" , "crates/libs/lib-api", "crates/libs/lib-server", "crates/libs/lib-config", "crates/libs/lib-auth", "crates/libs/lib-db", "crates/libs/lib-middleware", "crates/libs/lib-utils", "crates/libs/lib-core", "readmodel/seeds", "readmodel/tests/traffic"]

[workspace.dependencies]
# No HTTP/2, TLS or body (de)compression: the gateway listens on plain HTTP/1.1 behind the load
# balancer. Dropping the default features keeps h2 0.3 and the brotli/zstd stack out of the tree.
actix-web = { version = "4.11.0", default-features = false, features = ["macros", "cookies"] }
tokio = {version = "1.45" , features = ["full"]}
serde = { version = "1.0", features = ["derive"] }
config = "0.14"
async-trait = "0.1.88"
thiserror = "1.0"
tempfile = "3.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
sea-orm = { version = "1.1.16", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
redis = { version = "1.0.0", features = ["tokio-comp", "connection-manager"] }
serde_json = "1.0.105"
jsonwebtoken = "9.3.1"
chrono = { version = "0.4.41", features = ["serde"] } 
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"

vex-networking ={ git = "https://github.com/trade-vex/vex-core" , rev = "29092e3197b680f1e7a4b213cdb7f6e8cb860a35"}
vex-config = { git = "https://github.com/trade-vex/vex-core" , rev = "29092e3197b680f1e7a4b213cdb7f6e8cb860a35"}
common = { git = "https://github.com/trade-vex/vex-core" , rev = "29092e3197b680f1e7a4b213cdb7f6e8cb860a35"}
