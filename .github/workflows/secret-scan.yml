name: Secret scanning

# Separate from ci.yml so it runs on a push to ANY branch or tag, not only main/develop:
# a key pushed to a branch that has no PR yet is caught at push time instead of on some
# later, unrelated PR run (or never, if the branch is deleted first). Pull requests are
# scanned as well. Branch protection must name this check alongside "CI required".
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: >-
            git
            --config=/github/workspace/.gitleaks.toml
            --log-opts=${{ github.event.pull_request.base.sha }}..${{ github.sha }}
            --redact
            --verbose
            --no-banner
            --no-color
            /github/workspace

      # The pushed commits are before..after, unless the push was forced (a rebased branch: the
      # old tip is no longer an ancestor and may not have been fetched) or created the branch or
      # tag (before is all zeros). Then they are the commits not on the default branch, or, for
      # a forced push to the default branch itself, everything reachable from the new tip.
      - name: Select pushed commits
        id: pushed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$FORCED" != true ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          elif [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] &&
            git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" >/dev/null; then
            range="$GITHUB_SHA --not refs/remotes/origin/$DEFAULT_BRANCH"
          else
            range="$GITHUB_SHA"
          fi
          echo "Scanning: $range"
          echo "log_opts=$range" >> "$GITHUB_OUTPUT"

      - name: Scan pushed commits
        if: github.event_name == 'push'
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: >-
            git
            --config=/github/workspace/.gitleaks.toml
            --log-opts="${{ steps.pushed.outputs.log_opts }}"
            --redact
            --verbose
            --no-banner
            --no-color
            /github/workspace

      - name: Scan full history
        if: always()
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: >-
            git
            --config=/github/workspace/.gitleaks.toml
            --log-opts="--all --root -m"
            --redact
            --verbose
            --no-banner
            --no-color
            /github/workspace
