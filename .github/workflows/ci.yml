name: Vex Gateway CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      CI: true
      SERVER_HOST: ${{ secrets.SERVER_HOST || '127.0.0.1' }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '8000' }}
      DATABASE_URL: postgres://myuser:mypassword@localhost:5432/mydb
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY_PATH: crates/libs/lib-auth/src/keys/private_key.pem
      JWT_PUBLIC_KEY_PATH: crates/libs/lib-auth/src/keys/public_key.pem
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbsd-dev libssl-dev pkg-config build-essential clang libclang-dev openjdk-21-jdk uuid-dev
          # Install CMake 3.30+ (required by rusteron-archive/aeron)
          wget -q https://github.com/Kitware/CMake/releases/download/v3.30.0/cmake-3.30.0-linux-x86_64.sh
          sudo sh cmake-3.30.0-linux-x86_64.sh --prefix=/usr/local --skip-license
          echo "/usr/local/bin" >> $GITHUB_PATH
          export PATH="/usr/local/bin:$PATH"
          cmake --version

      - name: Generate test keys
        run: |
          mkdir -p crates/libs/lib-auth/src/keys
          openssl genrsa -out crates/libs/lib-auth/src/keys/private_key.pem 2048
          openssl rsa -in crates/libs/lib-auth/src/keys/private_key.pem -pubout -out crates/libs/lib-auth/src/keys/public_key.pem

      - name: Build workspace
        run: cargo build --workspace

      - name: Build workspace (release)
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Enforce formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbsd-dev libssl-dev pkg-config build-essential clang libclang-dev openjdk-21-jdk uuid-dev
          # Install CMake 3.30+ (required by rusteron-archive/aeron)
          wget -q https://github.com/Kitware/CMake/releases/download/v3.30.0/cmake-3.30.0-linux-x86_64.sh
          sudo sh cmake-3.30.0-linux-x86_64.sh --prefix=/usr/local --skip-license
          echo "/usr/local/bin" >> $GITHUB_PATH
          export PATH="/usr/local/bin:$PATH"
          cmake --version

      - name: Linting
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings -A clippy::missing_errors_doc -A clippy::missing_panics_doc -A clippy::must_use_candidate -A clippy::default_trait_access -A clippy::ignored_unit_patterns -A clippy::module_name_repetitions -A clippy::cast_possible_truncation

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      CI: true
      SERVER_HOST: ${{ secrets.SERVER_HOST || '127.0.0.1' }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '8000' }}
      DATABASE_URL: postgres://myuser:mypassword@localhost:5432/mydb
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY_PATH: crates/libs/lib-auth/src/keys/private_key.pem
      JWT_PUBLIC_KEY_PATH: crates/libs/lib-auth/src/keys/public_key.pem
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbsd-dev libssl-dev pkg-config build-essential clang libclang-dev openjdk-21-jdk uuid-dev
          # Install CMake 3.30+ (required by rusteron-archive/aeron)
          wget -q https://github.com/Kitware/CMake/releases/download/v3.30.0/cmake-3.30.0-linux-x86_64.sh
          sudo sh cmake-3.30.0-linux-x86_64.sh --prefix=/usr/local --skip-license
          echo "/usr/local/bin" >> $GITHUB_PATH
          export PATH="/usr/local/bin:$PATH"
          cmake --version

      - name: Generate test keys
        run: |
          mkdir -p crates/libs/lib-auth/src/keys
          openssl genrsa -out crates/libs/lib-auth/src/keys/private_key.pem 2048
          openssl rsa -in crates/libs/lib-auth/src/keys/private_key.pem -pubout -out crates/libs/lib-auth/src/keys/public_key.pem

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate code coverage
        run: |
          cargo tarpaulin --verbose --workspace --timeout 600 --out Html --output-dir coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        # RUSTSEC-2023-0071: rsa crate timing side-channel (Marvin Attack). MEDIUM severity.
        #   Ignored because: RSA operations are not exposed in network-observable timing paths.
        #   JWT signing uses constant-time implementations and keys are used server-side only.
        # RUSTSEC-2025-0134: rustls-pemfile unmaintained (informational).
        #   Ignored because: Migration to rustls-pki-types planned for future release.
        #   This is informational only, not a security vulnerability.
        # RUSTSEC-2025-0141: bincode unmaintained (informational).
        #   Ignored because: Migration to bincode 2.x/3.x requires significant API changes.
        #   Used for binary serialization in cache layer. Not a security vulnerability.
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2025-0141