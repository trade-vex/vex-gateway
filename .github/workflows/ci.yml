name: Vex Gateway CI

on:
  push:
    branches: [main, develop]
  # No base-branch filter: stacked PRs are based on their predecessor, not on develop.
  # `edited` is required as well: retargeting a stacked PR onto develop as the stack
  # merges is an edit, and the default event types do not include it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

# Per-PR, so restacking cancels only that PR's superseded runs. A workflow-wide group
# would discard other PRs' pending checks. Each push gets its own group (run_id): GitHub
# cancels a PENDING run whenever a newer one joins its group, even without
# cancel-in-progress, so a per-branch group would skip develop commits merged back to back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      CI: true
      DATABASE_URL: postgres://myuser:mypassword@localhost:5432/mydb
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbsd-dev libssl-dev pkg-config build-essential clang libclang-dev openjdk-21-jdk uuid-dev
          # Install CMake 3.30+ (required by rusteron-archive/aeron)
          wget -q https://github.com/Kitware/CMake/releases/download/v3.30.0/cmake-3.30.0-linux-x86_64.sh
          sudo sh cmake-3.30.0-linux-x86_64.sh --prefix=/usr/local --skip-license
          echo "/usr/local/bin" >> $GITHUB_PATH
          export PATH="/usr/local/bin:$PATH"
          cmake --version

      - name: Generate test keys
        run: |
          mkdir -p crates/libs/lib-auth/src/keys
          openssl genrsa -out crates/libs/lib-auth/src/keys/private_key.pem 2048
          openssl rsa -in crates/libs/lib-auth/src/keys/private_key.pem -pubout -out crates/libs/lib-auth/src/keys/public_key.pem

      - name: Build workspace
        run: cargo build --workspace
        
      - name: Run tests
        run: cargo test --workspace

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Enforce formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbsd-dev libssl-dev pkg-config build-essential clang libclang-dev openjdk-21-jdk uuid-dev
          # Install CMake 3.30+ (required by rusteron-archive/aeron)
          wget -q https://github.com/Kitware/CMake/releases/download/v3.30.0/cmake-3.30.0-linux-x86_64.sh
          sudo sh cmake-3.30.0-linux-x86_64.sh --prefix=/usr/local --skip-license
          echo "/usr/local/bin" >> $GITHUB_PATH
          export PATH="/usr/local/bin:$PATH"
          cmake --version

      - name: Linting
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings -A clippy::missing_errors_doc -A clippy::missing_panics_doc -A clippy::must_use_candidate -A clippy::default_trait_access -A clippy::ignored_unit_patterns -A clippy::module_name_repetitions -A clippy::cast_possible_truncation

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      CI: true
      DATABASE_URL: postgres://myuser:mypassword@localhost:5432/mydb
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbsd-dev libssl-dev pkg-config build-essential clang libclang-dev openjdk-21-jdk uuid-dev
          # Install CMake 3.30+ (required by rusteron-archive/aeron)
          wget -q https://github.com/Kitware/CMake/releases/download/v3.30.0/cmake-3.30.0-linux-x86_64.sh
          sudo sh cmake-3.30.0-linux-x86_64.sh --prefix=/usr/local --skip-license
          echo "/usr/local/bin" >> $GITHUB_PATH
          export PATH="/usr/local/bin:$PATH"
          cmake --version

      - name: Generate test keys
        run: |
          mkdir -p crates/libs/lib-auth/src/keys
          openssl genrsa -out crates/libs/lib-auth/src/keys/private_key.pem 2048
          openssl rsa -in crates/libs/lib-auth/src/keys/private_key.pem -pubout -out crates/libs/lib-auth/src/keys/public_key.pem

      # cargo-llvm-cov, not tarpaulin: tarpaulin links with -Clink-dead-code, which leaves the
      # rusteron (Aeron) C symbols unresolved.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@0.9.1
          checksum: true
          fallback: none

      - name: Generate code coverage
        run: cargo llvm-cov --workspace --html --output-dir coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Single required check: branch protection names this job instead of each job, so a job
  # that is added, renamed or skipped cannot silently drop out of the gate (a SKIPPED job
  # satisfies an ordinary required-status rule).
  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: [test, fmt, clippy, coverage, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              print("Required jobs did not succeed:", ", ".join(failed))
              sys.exit(1)
          print("All required jobs succeeded:", ", ".join(results))
          EOF

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none

      - name: Run security audit
        # Accepted advisories live in .cargo/audit.toml, each with its reason.
        run: cargo audit --deny warnings
