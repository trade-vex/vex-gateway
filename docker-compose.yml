services:
  postgres:
    image: postgres:15-alpine
    container_name: vex-gateway-postgres
    environment:
      POSTGRES_DB: vex_gateway
      POSTGRES_USER: vex_user
      POSTGRES_PASSWORD: vex_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./crates/libs/lib-auth/migrations:/docker-entrypoint-initdb.d/auth
      - ./crates/libs/lib-middleware/migrations:/docker-entrypoint-initdb.d/middleware
    networks:
      - vex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vex_user -d vex_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vex-gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vex-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  aeron-media-driver:
    image: vex-gateway-aeron-media-driver:latest
    build:
      context: .
      dockerfile: Dockerfile.aeron-media-driver
    container_name: vex-gateway-aeron
    ports:
      - "40123:40123"
    networks:
      - vex-network
    healthcheck:
      test: ["CMD", "pgrep", "aeronmd"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: vex-gateway-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: vex-gateway-app
    environment:
      APP_ENV: development
      APP_SERVER_HOST: 0.0.0.0
      APP_SERVER_PORT: 8080
      DATABASE_URL: postgres://vex_user:vex_password@postgres:5432/vex_gateway
      REDIS_URL: redis://redis:6379
      AERON_MEDIA_DRIVER_HOST: aeron-media-driver
      AERON_MEDIA_DRIVER_PORT: 40123
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_ISSUER: vex-gateway
      JWT_AUDIENCE: api
      JWT_ACCESS_TOKEN_TTL_MINUTES: 60
      JWT_REFRESH_TOKEN_TTL_DAYS: 7
      LD_LIBRARY_PATH: /usr/local/lib
    ports:
      - "8080:8081"
    volumes:
      - ./keys:/app/keys
      - ./config:/app/config
      - ./aeron-binaries/lib:/usr/local/lib
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      aeron-media-driver:
        condition: service_healthy
    networks:
      - vex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: vex-gateway-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - vex-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vex-gateway-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vex-gateway.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8082:80"
    depends_on:
      - postgres
    networks:
      - vex-network

volumes:
  postgres_data:
  redis_data:
  aeron_data:
  aeron_binaries:

networks:
  vex-network:
    driver: bridge
