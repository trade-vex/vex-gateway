[package]
name = "lib-middleware"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
url = "2.4"
ipnet = "2"
# RSASSA-PKCS1-v1_5 signature verification is behind the `pkcs1v15` feature since rsa 0.10.
rsa = { version = "0.10", features = ["pkcs1v15"] }
ed25519-dalek = { version = "2.0", features = ["pkcs8"] }
pkcs8 = { version = "0.10", features = ["pem"] } 
subtle = "2.5"
tokio = { workspace = true }
lru = "0.19"

# Database dependencies
sea-orm = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1.88"

# Redis dependencies (for L2 cache support)
redis = { workspace = true }
