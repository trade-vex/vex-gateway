[package]
name = "lib-middleware"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = "0.3"
chrono = { workspace = true, features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
url = "2.4"
rsa = { version = "0.9", features = ["sha2"] }
ed25519-dalek = { version = "2.0", features = ["pkcs8"] }
pkcs8 = { version = "0.10", features = ["pem"] }
sha1 = "0.10"
subtle = "2.5"
tokio = { version = "1.0", features = ["sync"] }
lru = "0.12"

# JWT/UUID (workspace-managed)
jsonwebtoken = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

# Database dependencies
sea-orm = { version = "0.12.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
async-trait = "0.1.88"

# Redis dependencies
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
bb8 = "0.8"
bincode = "1.3"

# Internal dependencies
lib-auth = { path = "../lib-auth" }
lib-db = { path = "../lib-db" }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "test-util"] }
tokio-test = "0.4"
tempfile = "3.8"
wiremock = "0.5"