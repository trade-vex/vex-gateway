[package]
name = "lib-db"
version = "0.1.0"
edition = "2024"

[dependencies]
# Core dependencies 
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# PostgreSQL support 
sqlx = { version = "0.7", optional = true }

# Redis support 
redis = { version = "0.25", optional = true }

# Redis-specific dependencies (only needed with Redis)
bb8 = { version = "0.8", optional = true }
bincode = { version = "1.3", optional = true }
futures = { version = "0.3", optional = true }

[features]
default = ["postgres", "redis"]

# PostgreSQL feature
postgres = [
    "dep:sqlx",           # Enable sqlx dependency
    "sqlx/postgres",      # Enable postgres support in sqlx
    "sqlx/runtime-tokio-rustls"  # Enable tokio runtime with rustls
]

# Redis feature 
redis = [
    "dep:redis",          # Enable redis dependency
    "redis/tokio-comp",   # Enable tokio support in redis
    "redis/connection-manager",  # Enable connection manager
    "dep:bb8",            # Enable bb8 for connection pooling
    "dep:bincode",        # Enable bincode for serialization
    "dep:futures"         # Enable futures for BoxFuture
]