[package]
name = "lib-db"
version = "0.1.0"
edition = "2024"

[dependencies]
# Core dependencies 
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Memory store dependencies
dashmap = "5.5"
once_cell = "1.19"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }

# PostgreSQL support 
sqlx = { version = "0.8.4", optional = true }

# Redis support 
redis = { workspace = true, optional = true }

# Redis-specific dependencies (only needed with Redis)
futures = { version = "0.3", optional = true }

[features]
default = ["postgres", "redis"]

# PostgreSQL feature
postgres = [
    "dep:sqlx",           # Enable sqlx dependency
    "sqlx/postgres",      # Enable postgres support in sqlx
    "sqlx/runtime-tokio-rustls"  # Enable tokio runtime with rustls
]

# Redis feature
redis = [
    "dep:redis",          # Enable redis dependency
    "dep:futures"         # Enable futures for BoxFuture
]