[package]
name = "lib-auth"
version = "0.1.0"
edition = "2024"

[dependencies]

# Web Framework
actix-web = "4"
actix-session = { version = "0.7", features = ["redis-rs-session"] }

# SSO & JWT
openidconnect = { version = "3", features = ["reqwest"] }
jsonwebtoken = { workspace = true }
reqwest = { version = "0.11", features = ["json"] }

# Data & Config
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
config = { version = "0.13", features = ["toml"] }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
once_cell = "1"

# Async & Error Handling
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
anyhow = "1"
thiserror = { workspace = true }

# Database & Cache
deadpool-redis = "0.13"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Logging
log = "0.4"

dotenvy = "0.15"
async-trait = "0.1.88"
mockall = "0.11"
sea-orm = { version = "0.12.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
tracing.workspace = true
url = "2.5.4"
rand = "0.8"
base64 = "0.22.1"
sha2 = "0.10.9"
validator = "0.20.0"
tokio-test = "0.4.4"
rsa = "0.9.8"
axum = "0.8.4"
[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0"
